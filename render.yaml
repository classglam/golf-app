# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Database + video storage live in Supabase (see DEPLOY.md); values marked
# sync: false are asked for when the Blueprint is created.
services:
  - type: web
    name: golf-coach-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: >-
      npm ci --include=dev --include-workspace-root
      --workspace=packages/shared-types --workspace=apps/api
      && npm run prisma:generate --workspace=apps/api
      && npm run build --workspace=apps/api
    startCommand: npm run start:prod --workspace=apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: golf-videos
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5

  - type: web
    name: golf-coach
    runtime: static
    buildCommand: >-
      npm ci --include=dev --include-workspace-root
      --workspace=packages/shared-types --workspace=apps/web
      && npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public URL of the API service above. Change it if Render gives the
      # API a different hostname.
      - key: VITE_API_URL
        value: https://golf-coach-api.onrender.com
